<script>
const SLOTS=8;
function storeGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function store(k,v){try{localStorage.setItem(k,v);return localStorage.getItem(k)===v}catch(e){return false}}
function pilots(){const a=[];for(let i=0;i<SLOTS;i++){let p=null;try{p=JSON.parse(storeGet('orbit.pilot.'+i)||'null')}catch(e){}a.push(p&&p.name?p:null)}return a}
let stop=null;
function drawMenu(){
  const box=document.getElementById('pilots');box.innerHTML='';
  pilots().forEach((p,i)=>{if(!p)return;const b=document.createElement('button');b.textContent='Continue as '+p.name;b.onclick=()=>play(i);box.appendChild(b);const d=document.createElement('button');d.textContent='Delete';d.style.marginLeft='8px';d.onclick=()=>{if(d.dataset.sure!=='1'){d.dataset.sure='1';d.textContent='Tap again to delete '+p.name+' for good';return}const ok=store('orbit.pilot.'+i,'');document.getElementById('note').textContent=ok?'Pilot deleted.':'Could not delete the pilot. Storage is blocked.';drawMenu()};box.appendChild(d);box.appendChild(document.createElement('br'));box.appendChild(document.createElement('br'))});
}
document.getElementById('mk').onclick=create;
document.getElementById('nm').addEventListener('keydown',e=>{if(e.key==='Enter')create()});
function create(){
  const inp=document.getElementById('nm');const name=inp.value.trim().replace(/\s+/g,' ').slice(0,14);const ps=pilots();
  const note=document.getElementById('note');
  if(!name)return;
  if(ps.some(p=>p&&p.name.toLowerCase()===name.toLowerCase())){note.textContent='That name is taken on this device.';return}
  const free=ps.findIndex(p=>!p);if(free<0){note.textContent='All 8 slots are used.';return}
  if(!store('orbit.pilot.'+free,JSON.stringify({name,save:''}))){note.textContent='Could not save the new pilot. Storage is blocked or full.';return}
  inp.value='';note.textContent='';play(free);
}
function play(i){
  const p=pilots()[i];if(!p)return;document.getElementById('menu').style.display='none';
  const wrap=document.getElementById('wrap');wrap.innerHTML='<canvas tabindex="0"></canvas>';
  const cv=wrap.querySelector('canvas');
  stop=startGame(cv,p.save,s=>store('orbit.pilot.'+i,JSON.stringify({name:p.name,save:s})),{fill:true,onExit:()=>{if(stop)stop();stop=null;wrap.innerHTML='';document.getElementById('menu').style.display='flex';drawMenu()}});
  cv.focus();
}
drawMenu();
</script>

            for (let i = 0; i < 9; i++) { const bx = Math.round(W / 2 - 90 + i * 20), th = 18 + ((i * 37) % 5) * 7; const hit = introPage === 1; const h2 = hit && i > 1 && i < 7 ? Math.max(6, th - 14 - i * 2) : th; R(bx, gy - h2, 14, h2, hit ? '#2a3350' : '#3a4a70'); if (!hit) for (let j = 0; j < h2 - 4; j += 6) R(bx + 3, gy - h2 + 3 + j, 3, 3, Math.floor(time * 2 + i + j) % 5 ? '#ffe27a' : '#3a4a70'); }
            R(W / 2 - 100, gy, 200, 2, '#6f86ad');
            if (introPage === 0) { const k = tt / 6, ax = Math.round(W / 2 - 150 + k * 130), ay = Math.round(gy - 120 + k * 90); R(ax, ay, 8, 8, '#a8884a'); R(ax + 2, ay + 2, 4, 4, '#ff7a2a'); for (let t2 = 1; t2 < 8; t2++) R(ax - t2 * 4, ay - t2 * 3, 4 - Math.floor(t2 / 3), 3, 'rgba(255,170,80,' + (0.7 - t2 * 0.08).toFixed(2) + ')'); }
            else if (tt < 0.5) { ctx.fillStyle = 'rgba(255,255,255,' + (0.5 - tt).toFixed(2) + ')'; ctx.fillRect(W / 2 - 100, gy - 60, 200, 62); }
        }
        let y = 80;
        for (const l of wrap(INTRO[introPage], Math.floor((W - 30) / 6))) { text(l, W / 2, y, 9, '#fff', 'center'); y += 12; }
        text((introPage + 1) + '/' + INTRO.length, W / 2, H - 50, 9, '#8ea4cc', 'center');
        const last = introPage >= INTRO.length - 1;
        if (!last) btn(W - 64, 6, 56, 18, 'SKIP', () => { save.intro = true; panel = null; persist(); }, { size: 9 });
        btn(Math.round((W - 140) / 2), H - 40, 140, 24, last ? 'BEGIN' : 'NEXT', () => { if (last) { save.intro = true; panel = null; persist(); } else introPage++; }, { size: 11, fill: '#2c5aa8' });
    }
    function drawFinale() {
        box(3, 3, W - 6, H - 6, 'rgba(6,12,28,0.98)', '#ffe27a');
        text('SATURN', W / 2, 40, 14, '#ffe27a', 'center');
        let story, y = 64;
        if (save.ringDone && !save.door) story = 'FIVE CORES ARE ALIGNED. THE DOOR WAITS FOR YOUR WORD. ONE MESSAGE FROM EARTH SAYS OPEN IT. THE OTHER SAYS BE CAREFUL. YOU DECIDE.';
        else if (save.door === 'open') story = 'THE RINGS PART AND SOFT LIGHT FILLS THE SHIP. NOTHING ATTACKS. A MAP OF NEW OUTPOSTS APPEARS FOR EARTH TO READ IN PEACE. NOVA SAYS: YOU WERE WISE AND KIND. END OF CHAPTER ONE.';
        else if (save.door === 'closed') story = 'YOU KEEP THE DOOR CLOSED AND SEND EARTH A WARNING AND A SAFE MAP INSTEAD. THE DOOR WILL WAIT FOR WHOEVER IS READY. NOVA SAYS: PATIENCE IS ALSO BRAVE. END OF CHAPTER ONE.';
        else story = 'The rings part. Inside them, a vast structure hums, waiting for a ship that finally climbed all 200 levels. The signal was never a call for help. It was a door. FIND 5 RING CORES AROUND SATURN TO REACH IT.';
        for (const l of wrap(story.toUpperCase(), Math.floor((W - 24) / 6))) { text(l, W / 2, y, 9, '#fff', 'center'); y += 11; }
        const done = (c) => { save.door = c; toast(c === 'open' ? 'Unlocked: Aurora ship paint (ship menu)' : 'Unlocked: Ember ship paint (ship menu)'); log('SATURN DOOR: ' + (c === 'open' ? 'opened in peace.' : 'kept closed, with a warning and a map sent to Earth.')); persist(); };
        if (save.ringDone && !save.door) {
            btn(Math.round(W / 2 - 150), y + 14, 140, 22, 'OPEN THE DOOR', () => done('open'), { size: 10, fill: '#2c5aa8' });
            btn(Math.round(W / 2 + 10), y + 14, 140, 22, 'KEEP IT CLOSED', () => done('closed'), { size: 10 });
        } else {
            const bw2 = Math.min(140, Math.floor((W - 30) / 2));
            btn(Math.round(W / 2 - bw2 - 5), y + 14, bw2, 22, 'SATURN MARKET', () => { panel = 'saturn'; satPage = 0; }, { size: 9, fill: '#2c5aa8' });
            btn(Math.round(W / 2 + 5), y + 14, bw2, 22, save.ringDone ? 'THE END' : 'RETURN TO ORBIT', () => { panel = save.ringDone ? 'summary' : null; }, { size: 10 });
        }
    }

    function draw() {
        buttons = [];
        if (panel !== 'log') logOff = 0;
        ctx.imageSmoothingEnabled = false;
        if (mode === 'space') drawSpace(); else drawMars();
        drawHUD();
        if (panel) {
            buttons = [];
            ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
            if (panel === 'shop') drawShop();
            else if (panel === 'room') drawRoom();
            else if (panel === 'summary') drawSummary();
            else if (panel === 'missions') drawMissions();
            else if (panel === 'hint') drawHint();
            else if (panel === 'credits') drawCredits();
            else if (panel === 'bay') drawBay();
            else if (panel === 'log') drawLog();
            else if (panel === 'menu') drawMenu();
            else if (panel === 'settings') drawSettings();
            else if (panel === 'town') drawTown();
            else if (panel === 'city') drawCity();
            else if (panel === 'story') drawStory();
            else if (panel === 'intro') drawIntro();
            else if (panel === 'controls') drawControls();
            else if (panel === 'backup') drawBackup();
            else if (panel === 'shipframe') drawShipPanel();
            else if (panel === 'arrows') drawArrows();
            else if (panel === 'projects') drawProjects();
            else if (panel === 'planets') drawPlanets();
            else if (panel === 'mastery') drawMastery();
            else if (panel === 'pshop') drawPShop();
            else if (panel === 'saturn') drawSaturn();
            else if (panel === 'profile') drawProfile();
            else if (panel === 'rocket') drawRocket();
            else if (panel === 'finale') drawFinale();
        }
    }

    // ---------- fullscreen ----------
    function fullscreen() {
        const el = canvas.parentElement;
        try {
            if (document.fullscreenElement) { document.exitFullscreen(); return; }
            const p = el.requestFullscreen ? el.requestFullscreen() : null;
            if (p && p.catch) p.catch(() => { toast('Fullscreen is blocked on this page. Use the downloaded HTML file.'); if (opts && opts.onExpand) opts.onExpand(); });
            else { toast('Fullscreen is not available here.'); if (opts && opts.onExpand) opts.onExpand(); }
        } catch (e) { toast('Fullscreen is not available here.'); if (opts && opts.onExpand) opts.onExpand(); }
    }

    // ---------- loop + resize ----------
    function resize() {
        const par = canvas.parentElement, rect = par.getBoundingClientRect();
        const cssW = Math.max(240, Math.floor(rect.width));
        let cssH;
        if (document.fullscreenElement === par || (opts && opts.fill)) cssH = Math.max(170, Math.floor(document.fullscreenElement === par ? window.innerHeight : (opts && opts.fill ? window.innerHeight : rect.height)));
        else if (par.dataset && par.dataset.big === '1') cssH = Math.round(Math.min(cssW * 0.9, (window.screen.height || 800) * 0.85));
        else cssH = cssW > 720 ? Math.round(cssW * 0.62) : Math.min(560, Math.round(cssW * 1.25));
        let s = Math.min(cssH / 300, cssW / 240);
        if (s >= 2) s = Math.floor(s);
        s = Math.max(1, s);
        { const z = Math.max(0, Math.min(2, Math.floor(Number(save.settings.zoom) || 0))); if (z > 0) { const cap = Math.min(Math.floor(cssH / 240), Math.floor(cssW / 340)); s = Math.max(s, Math.min(s + z, cap)); } }
        W = Math.ceil(cssW / s); H = Math.ceil(cssH / s);
        canvas.style.height = cssH + 'px';
        canvas.width = W; canvas.height = H;
    }
    resize();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => resize()) : null;
    if (ro) ro.observe(canvas.parentElement);
    const onFs = () => resize();
    document.addEventListener('fullscreenchange', onFs);
    window.addEventListener('resize', onFs);
    let last = performance.now(), raf = 0, stopped = false;
    function frame(now) {
        if (stopped) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        try { pollPad(dt); update(dt); draw(); drawPadCursor(); } catch (e) { console.error(e); }
        raf = requestAnimationFrame(frame);
    }
    if (!save.intro) panel = 'intro';
    if (save.intro && save.level >= MAXLV) novaQ.push('SATURN IS FAR EAST, BEYOND THE RED BORDER. FOLLOW THE ARROW. PRESS ACT NEAR IT TO LAND, LIKE ANY PLANET.');
    { const away = save.last ? Date.now() - save.last : 0; if (save.intro && away > 3600000) { const h = Math.min(999, Math.floor(away / 3600000)); novaQ.push('WELCOME BACK, PILOT. YOU WERE AWAY ' + h + ' HOURS. NO PENALTY. ' + (Object.keys(save.pl).some((id) => save.pl[id] && save.pl[id].mine && save.pl[id].mine.built) ? 'YOUR CITIES KEPT WORKING (UP TO 10 HOURS). COLLECT IN THE CITY PANEL.' : 'THE SIGNAL IS STILL OUT THERE.')); } }
    raf = requestAnimationFrame(frame);
    toast('Collect shards. Shoot meteors. Reach Saturn.');

    return () => {
        stopped = true; cancelAnimationFrame(raf); persist();
        window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp); window.removeEventListener('pointerdown', onWinDown);
        document.removeEventListener('fullscreenchange', onFs); window.removeEventListener('resize', onFs); window.removeEventListener('blur', onBlur); document.removeEventListener('visibilitychange', onVis);
        if (ro) ro.disconnect();
    };
}
</script>
